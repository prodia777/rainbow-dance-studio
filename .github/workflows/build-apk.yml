# GitHubに置くと、自動でAPK（Androidアプリのインストールファイル）を作ります
name: Build Android APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'apk/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: 署名鍵を準備（リポジトリのSecretsに登録した場合）
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/rainbowdancestudio-release.jks
          printf 'storeFile=rainbowdancestudio-release.jks\nstorePassword=%s\nkeyAlias=rainbowdancestudio\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties
      - name: 正式版（署名鍵あり）を作る
        if: env.HAS_KEY == 'true'
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: テスト版（署名鍵なし）を作る
        if: env.HAS_KEY != 'true'
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RainbowDanceStudio-apk
          path: android/app/build/outputs/apk/**/*.apk
      - name: できたAPKを builds ブランチに保存（Claudeが取りに行けるように）
        run: |
          mkdir -p /tmp/out && find android/app/build/outputs/apk -name '*.apk' -exec cp {} /tmp/out/ \;
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin builds:builds 2>/dev/null || true
          git checkout --orphan tmp-builds && git rm -rqf --cached . && rm -rf ./* .github .gitignore 2>/dev/null || true
          mkdir -p apk && cp /tmp/out/*.apk apk/ && echo "${{ github.sha }}" > apk/SOURCE_COMMIT.txt
          git add apk && git commit -qm "APK build ${{ github.run_number }}" && git push -f origin HEAD:builds
